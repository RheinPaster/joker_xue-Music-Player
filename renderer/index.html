<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>薛之谦音乐播放器</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="32" cy="32" r="26" opacity=".55"/>
              <path d="M22 34c2 6 6 9 10 9s8-3 10-9"/>
              <circle cx="26" cy="27" r="1.6" fill="currentColor" stroke="none"/>
              <circle cx="38" cy="27" r="1.6" fill="currentColor" stroke="none"/>
            </g>
          </svg>
        </div>
        <div class="brand-text">
          <b>薛之谦</b><span>音乐播放器</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="all">
          <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
          <span>全部歌曲</span>
        </button>
        <button class="nav-item" data-view="fav">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-9c-1.4-3 .6-6.4 4-6.4 2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 3.4 0 5.4 3.4 4 6.4-2 4.4-9 9-9 9z"/></svg>
          <span>我的收藏</span>
        </button>
        <button class="nav-item" data-view="history">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8"/><path d="M4 4v5h5"/><path d="M12 8v4l3 2"/></svg>
          <span>最近播放</span>
        </button>
      </nav>

      <div class="album-title">
        <span>专辑</span>
        <span class="album-title-tools">
          <button class="icon-btn" id="batchLyricsBtn" title="批量获取全部歌词（LRCLIB）">
            <svg viewBox="0 0 24 24"><path d="M5 5h14M5 10h14M5 15h9"/><path d="M17 18l1.4 1.4L21 16"/></svg>
          </button>
          <button class="icon-btn" id="batchCoverBtn" title="批量获取全部封面（iTunes）">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="M4 17l5-5 4 4 3-2 4 4"/></svg>
          </button>
          <button class="icon-btn" id="openFolderBtn" title="打开本地音乐文件夹">
            <svg viewBox="0 0 24 24"><path d="M4 6h5l2 2h9a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V7a1 1 0 011-1z"/></svg>
          </button>
        </span>
      </div>
      <div class="album-list" id="albumList"></div>

      <div class="sidebar-foot">
        <div class="status-dot" id="localStatus"></div>
        <span id="localStatusText">内置演示音源</span>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="main">
      <header class="main-head">
        <div class="head-title" id="headTitle">全部歌曲</div>
        <div class="head-actions">
          <label class="search">
            <svg viewBox="0 0 24 24"><path d="M11 19a8 8 0 100-16 8 8 0 000 16z"/><path d="M17 17l4 4"/></svg>
            <input id="searchInput" type="text" placeholder="搜索歌名 / 专辑 / 年份" autocomplete="off" />
          </label>
          <button class="mini-btn" id="ownedFilterBtn" title="只显示本地已有的歌曲 / 显示完整目录">仅显示已有</button>
          <button class="play-all-btn" id="playAllBtn">▶ 播放全部</button>
        </div>
      </header>

      <section class="content" id="content">
        <div class="list-view" id="listView"></div>
        <div class="detail-view" id="detailView" hidden></div>
      </section>
    </main>

    <!-- 底部播放条 -->
    <footer class="player" id="player">
      <div class="player-left">
        <div class="cover" id="playerCover">
          <svg class="cover-icon" viewBox="0 0 64 64" width="22" height="22"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="32" cy="32" r="24" opacity=".6"/><path d="M24 31c2 5 5 7 8 7s6-2 8-7"/></g></svg>
          <img class="cover-img" id="playerCoverImg" alt="" hidden />
        </div>
        <div class="pinfo">
          <div class="ptitle" id="playerTitle">未在播放</div>
          <div class="palbum" id="playerAlbum">选择一首歌开始</div>
        </div>
        <button class="icon-btn heart" id="favBtn" title="收藏">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-9c-1.4-3 .6-6.4 4-6.4 2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 3.4 0 5.4 3.4 4 6.4-2 4.4-9 9-9 9z"/></svg>
        </button>
      </div>

      <div class="player-center">
        <div class="controls">
          <button class="ctrl" id="modeBtn" title="播放模式">
            <svg viewBox="0 0 24 24"><path d="M7 7v10M17 7v10M7 12h10"/></svg>
          </button>
          <button class="ctrl" id="prevBtn" title="上一首">
            <svg viewBox="0 0 24 24"><path d="M6 5v14M19 6l-9 6 9 6z"/></svg>
          </button>
          <button class="ctrl play" id="playBtn" title="播放">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" hidden><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
          </button>
          <button class="ctrl" id="nextBtn" title="下一首">
            <svg viewBox="0 0 24 24"><path d="M18 5v14M5 6l9 6-9 6z"/></svg>
          </button>
          <button class="ctrl" id="lyricsBtn" title="歌词">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </button>
        </div>
        <div class="progress">
          <span class="time" id="curTime">0:00</span>
          <div class="bar-wrap" id="seekBar">
            <div class="bar-track"><div class="bar-fill" id="seekFill"></div></div>
            <div class="bar-thumb" id="seekThumb"></div>
          </div>
          <span class="time" id="durTime">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button class="icon-btn" id="volumeBtn" title="音量">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg>
        </button>
        <div class="vbar" id="volumeBar"><div class="vbar-fill" id="volumeFill"></div></div>
      </div>
    </footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
